<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241827">
<title>A little bouquet for Anna</title>
<style>
  :root { color-scheme: dark; --pink:#f4a1c5; --pale:#ffd6e7; --bg:#241827; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:radial-gradient(ellipse at 50% 35%,#493044 0%,#2b1d2e 48%,#17121d 100%); color:#ffe8f1; font-family:Georgia,"Times New Roman",serif; }
  body { min-height:100svh; overflow:hidden; }
  .screen { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
  #intro { gap:17px; }
  .heart { color:var(--pink); font-size:36px; line-height:1; text-shadow:0 0 24px #f28dbb88; }
  h1 { margin:0; color:var(--pale); font-size:clamp(34px,9vw,54px); font-weight:normal; letter-spacing:.02em; }
  .intro-copy { margin:0; color:#f3cbdc; font-size:clamp(17px,4.5vw,21px); }
  .open-btn { margin-top:12px; border:1px solid #f5b7d2; border-radius:999px; padding:15px 27px; background:linear-gradient(135deg,#b85c88,#88436d); color:white; font:600 16px system-ui,sans-serif; box-shadow:0 8px 30px #100b1880; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .open-btn:active { transform:scale(.98); }
  .tiny { color:#c9a9ba; font:12px system-ui,sans-serif; letter-spacing:.04em; }
  #gift { display:none; gap:8px; padding-top:12px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  #gift h2 { margin:0; color:#ffd0e4; font-size:clamp(20px,5vw,27px); font-weight:normal; letter-spacing:.08em; }
  #gift p { margin:0; color:#ffb9d5; font-size:clamp(21px,5.8vw,30px); }
  canvas { width:min(100%,620px); height:min(67svh,620px); min-height:330px; display:block; }
  @media (max-height:650px) { canvas { height:58svh; min-height:250px; } #gift { gap:4px; } }
  @media (prefers-reduced-motion:reduce) { .open-btn { transition:none; } }
</style>
</head>
<body>
<main>
  <section id="intro" class="screen">
    <div class="heart">♡</div>
    <h1>For Anna</h1>
    <p class="intro-copy">I've made a little something for you...</p>
    <button class="open-btn" id="open">Open your surprise ♥</button>
    <div class="tiny">A little gift, made with love</div>
  </section>
  <section id="gift" class="screen" aria-label="A spinning bouquet of flowers">
    <h2>A LITTLE BOUQUET FOR YOU</h2>
    <canvas id="bouquet" aria-label="An animated bouquet of colourful flowers"></canvas>
    <p>I LOVE YOU ANNA POOLE ♥</p>
    <div class="tiny">Made with love · Inspired by ASCII Flower Bouquet by Alish Sharma</div>
  </section>
</main>
<script>
(() => {
  const intro = document.getElementById('intro');
  const gift = document.getElementById('gift');
  const button = document.getElementById('open');
  const canvas = document.getElementById('bouquet');
  const ctx = canvas.getContext('2d');
  let started = false, startTime = 0, raf = 0;
  const flowers = [];
  const palettes = [
    ['#ffb4d2','#f47eae','#e95b9c','#ffe1ed'],
    ['#f7a9d0','#d968a7','#b94d91','#ffd5e9'],
    ['#d9b5ff','#b78be8','#9166cb','#f0ddff'],
    ['#fff0a8','#ffd35e','#e9a83c','#fff4cf'],
    ['#ff9b9b','#ed5b70','#c83c5c','#ffd0d0'],
    ['#ffcf9b','#f49b63','#d96e50','#ffe2bd']
  ];
  // Ten flower heads arranged in a loose, rounded bouquet.
  for (let i=0;i<10;i++) {
    const a = i * 2.399963;
    const ring = i===0 ? 0 : .34 + .16*Math.sqrt(i);
    flowers.push({
      x: Math.cos(a)*ring, y: .36 + (i%3)*.105,
      z: Math.sin(a)*ring, size: .105 + (i%3)*.008,
      petals: 8 + (i%4)*2, palette: palettes[i%palettes.length],
      phase: a*.7, tulip: i===3 || i===8
    });
  }
  const hearts = Array.from({length:24},(_,i)=>({
    x:Math.random(), y:Math.random(), speed:.035+Math.random()*.055,
    phase:Math.random()*Math.PI*2, size:8+Math.random()*8
  }));
  function resize() {
    const rect=canvas.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function project(x,y,z,angle,w,h) {
    const ca=Math.cos(angle), sa=Math.sin(angle);
    const xr=x*ca-z*sa, zr=x*sa+z*ca;
    const tilt=.25, yt=(y-.22)*Math.cos(tilt)-zr*Math.sin(tilt);
    const zt=(y-.22)*Math.sin(tilt)+zr*Math.cos(tilt);
    const f=3.4/(3.4-zt);
    return {x:w*.5+xr*f*w*.70, y:h*.62-yt*f*h*.78, z:zt};
  }
  function line3(a,b,angle,w,h,color,width) {
    const p=project(...a,angle,w,h), q=project(...b,angle,w,h);
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  }
  function drawFlower(f,angle,w,h,t) {
    const p=project(f.x,f.y,f.z,angle,w,h);
    const scale=Math.min(w,h)*.22/(3.4-p.z);
    const r=f.size*scale*3.4;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(f.phase+angle*.22);
    if (f.tulip) {
      ctx.fillStyle=f.palette[1];
      ctx.beginPath(); ctx.moveTo(-r*.65,r*.45); ctx.quadraticCurveTo(-r*.9,-r*.5,-r*.48,-r*.85);
      ctx.quadraticCurveTo(-r*.15,-r*.35,0,-r*.9); ctx.quadraticCurveTo(r*.2,-r*.4,r*.52,-r*.82);
      ctx.quadraticCurveTo(r*.95,-r*.35,r*.62,r*.45); ctx.quadraticCurveTo(0,r*.9,-r*.65,r*.45); ctx.fill();
      ctx.strokeStyle=f.palette[0]; ctx.lineWidth=2; ctx.stroke();
    } else {
      for(let j=0;j<f.petals;j++) {
        const a=j*Math.PI*2/f.petals, rr=r*.48;
        ctx.save(); ctx.rotate(a);
        const grad=ctx.createLinearGradient(0,-r*.15,0,-r*1.15);
        grad.addColorStop(0,f.palette[0]); grad.addColorStop(.65,f.palette[1]); grad.addColorStop(1,f.palette[2]);
        ctx.fillStyle=grad;
        ctx.beginPath(); ctx.ellipse(0,-rr*.88,r*.25,r*.62,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle=f.palette[3]; ctx.beginPath(); ctx.arc(0,0,r*.34,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#b87943'; ctx.beginPath(); ctx.arc(0,0,r*.18,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function draw(t) {
    const rect=canvas.getBoundingClientRect(), w=rect.width, h=rect.height;
    ctx.clearRect(0,0,w,h);
    const elapsed=(t-startTime)/1000, angle=elapsed*.48;
    // Soft halo behind the bouquet.
    const halo=ctx.createRadialGradient(w/2,h*.48,4,w/2,h*.48,Math.min(w,h)*.48);
    halo.addColorStop(0,'#f5a6cc22'); halo.addColorStop(1,'#f5a6cc00');
    ctx.fillStyle=halo; ctx.fillRect(0,0,w,h);
    // Floating hearts.
    ctx.font='16px Georgia'; ctx.textAlign='center';
    hearts.forEach((heart,i)=>{
      const yy=((heart.y-elapsed*heart.speed)%1+1)%1;
      ctx.globalAlpha=.22+.3*(.5+.5*Math.sin(elapsed*1.4+heart.phase));
      ctx.fillStyle=i%2?'#f5a1c6':'#ffd1e4';
      ctx.fillText('♥',heart.x*w+Math.sin(elapsed+heart.phase)*8,yy*h,20);
    });
    ctx.globalAlpha=1;
    // Stems and leaves.
    flowers.forEach((f,i)=>{
      const top=[f.x,f.y-.035,f.z], base=[f.x*.18,-.55,f.z*.18];
      line3(base,top,angle,w,h,'#527d59',Math.max(2,w*.006));
      if(i%2===0) {
        const leaf=[f.x*.65,-.16,f.z*.65];
        line3(leaf,[leaf[0]+.13,-.06,leaf[2]+.04],angle,w,h,'#6d9a70',Math.max(2,w*.009));
      }
    });
    // Bouquet wrapping: tapered paper cone.
    const wrapTop=[project(-.43,.16,0,angle,w,h),project(.43,.16,0,angle,w,h),
                   project(.22,-.52,0,angle,w,h),project(-.22,-.52,0,angle,w,h)];
    ctx.fillStyle='#e9d8cf'; ctx.strokeStyle='#c6a9a4'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(wrapTop[0].x,wrapTop[0].y); ctx.lineTo(wrapTop[1].x,wrapTop[1].y);
    ctx.lineTo(wrapTop[2].x,wrapTop[2].y); ctx.lineTo(wrapTop[3].x,wrapTop[3].y); ctx.closePath(); ctx.fill(); ctx.stroke();
    // Ribbon and bow.
    const knot=project(0,-.22,.12,angle,w,h);
    ctx.strokeStyle='#c65b8d'; ctx.lineWidth=Math.max(4,w*.012);
    ctx.beginPath(); ctx.ellipse(knot.x-13,knot.y,14,8,-.35,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(knot.x+13,knot.y,14,8,.35,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#e58bb3'; ctx.beginPath(); ctx.arc(knot.x,knot.y,5,0,Math.PI*2); ctx.fill();
    // Draw flowers last so the heads stay readable.
    flowers.forEach(f=>drawFlower(f,angle,w,h,elapsed));
    raf=requestAnimationFrame(draw);
  }
  button.addEventListener('click',()=>{
    if(started) return; started=true;
    intro.style.display='none'; gift.style.display='flex';
    requestAnimationFrame(()=>{ resize(); startTime=performance.now(); raf=requestAnimationFrame(draw); });
  });
  window.addEventListener('resize',()=>{ if(started) resize(); });
  window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
})();
</script>
</body>
</html>
